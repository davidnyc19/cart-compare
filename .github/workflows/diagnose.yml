name: Diagnose store websites
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scraper/diagnose.js
      - run: |
          git config user.name "price-robot"
          git config user.email "price-robot@users.noreply.github.com"
          git add site/data/diagnose.json
          git commit -m "Store website diagnosis" || true
          git pull --rebase -q && git push
